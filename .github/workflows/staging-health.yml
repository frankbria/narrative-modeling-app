name: Staging Health Probe

# Issue #552. Staging's Atlas password was rotated and nothing noticed for three
# weeks: the running backend kept its already-authenticated pool, and the only
# health check lived inside deploy.yml, so mean time to detection was "until the
# next deploy". Then the S3 bucket went missing and `/health/ready` still said
# `ready` — readiness is Mongo-only by design (#503).
#
# So this runs `python -m app.health_probe` INSIDE the backend container on a
# schedule, independent of deploys. The probe hits the running service's
# `/health/ready` and, in a fresh process with the container's env, probes S3 and
# OpenAI — every subsystem must be `healthy`, not just the HTTP code. A failure
# fails the run AND opens (or comments on) a tracking issue, so it is seen without
# anyone watching the Actions tab; a later green run closes that issue.
#
# Same network path and the same Development-environment secrets as deploy.yml
# (SSH_KEY, HOST, SSH_KNOWN_HOSTS, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, optional
# DEPLOY_USER / DEPLOY_PATH) — read deploy.yml's header for why HOST is the
# tailnet address. Secret-gated like backup-verify.yml: until they are configured
# this passes with a warning rather than filing red runs nobody can act on.

on:
  schedule:
    - cron: '17 * * * *' # hourly; cheap (one ssh), and an hour beats weeks
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe staging dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'frankbria/narrative-modeling-app'
    environment: Development
    timeout-minutes: 10
    steps:
      - name: Check deploy secrets are configured
        id: preflight
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=()
          [ -n "$SSH_KEY" ]            || missing+=("SSH_KEY")
          [ -n "$HOST" ]               || missing+=("HOST")
          [ -n "$SSH_KNOWN_HOSTS" ]    || missing+=("SSH_KNOWN_HOSTS")
          [ -n "$TS_OAUTH_CLIENT_ID" ] || missing+=("TS_OAUTH_CLIENT_ID")
          [ -n "$TS_OAUTH_SECRET" ]    || missing+=("TS_OAUTH_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets not set (${missing[*]}) — nothing probed. See .github/workflows/deploy.yml header."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to Tailscale
        if: steps.preflight.outputs.configured == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # umask first: the key must never be world-readable, even briefly.
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Run the probe in the backend container
        id: probe
        if: steps.preflight.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/narrative-modeling-app/staging' }}
        run: |
          # The probe's exit code is the verdict; its output is the summary. Capture
          # via a redirect (not a pipe) so the status is read the same way whether or
          # not the shell runs with pipefail, and `|| status=$?` keeps `-e` from
          # aborting before the summary is written on the one path that matters.
          status=0
          ssh -i ~/.ssh/staging_key -o BatchMode=yes "$DEPLOY_USER@$HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T backend python -m app.health_probe" \
            > /tmp/probe.txt 2>&1 || status=$?
          cat /tmp/probe.txt
          {
            echo "## Staging dependency probe"
            echo
            echo '```'
            cat /tmp/probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report the failure on an issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[P1] [ops] Staging health probe is failing'
          # shellcheck disable=SC2016 # the backticks are a literal markdown fence
          body=$(printf 'Run: %s\n\n```\n%s\n```\n\nSee docs/operations/CREDENTIAL_ROTATION.md if a secret was rotated recently.\n' "$RUN_URL" "$(cat /tmp/probe.txt)")
          # `// empty`: on no match jq would print the 4-char string "null", which
          # is non-empty and would send the very first failure to `gh issue comment null`.
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close a recovered alert
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[P1] [ops] Staging health probe is failing'
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          [ -z "$existing" ] || gh issue close "$existing" --comment "Recovered: every subsystem healthy in $RUN_URL"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/staging_key
