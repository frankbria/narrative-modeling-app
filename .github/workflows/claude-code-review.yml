name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    # Bump perms so Claude can actually comment on the PR.
    permissions:
      contents: read          # can read code
      pull-requests: write    # can comment / review on PRs
      issues: write           # PR comments are "issue comments" under the hood
      id-token: write         # fine to leave as-is; mainly for OIDC/Bedrock/Vertex

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # you can make this 0 if you want full history/context

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Auth for Claude itself (OAuth token from https://console.anthropic.com)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Auth for GitHub (this is what lets gh comment without 'gh auth login')
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Your prompt / instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.
            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # Tooling Claude is allowed to run
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
