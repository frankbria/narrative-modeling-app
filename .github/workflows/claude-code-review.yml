name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize]

# One review run per PR at a time; a new push cancels the in-flight run
# (third runaway safeguard for issue #188).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Runaway-run safeguard (issue #188): normal runs take ~3.5 min; a malfunctioning
    # run on PR #187 ran 55+ min posting junk comments before manual cancellation.
    timeout-minutes: 10

    # Bump perms so Claude can actually comment on the PR.
    permissions:
      contents: read          # can read code
      pull-requests: write    # can comment / review on PRs
      issues: write           # PR comments are "issue comments" under the hood
      id-token: write         # fine to leave as-is; mainly for OIDC/Bedrock/Vertex

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1   # you can make this 0 if you want full history/context

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@12531344451323133b0493233c759991ac61da12 # v1
        with:
          # Auth for Claude itself (OAuth token from https://console.anthropic.com)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Auth for GitHub (this is what lets gh comment without 'gh auth login')
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Your prompt / instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            CONTEXT (reference only): the repository's CLAUDE.md describes project
            conventions and style. Use it to inform your review, but do NOT include
            its content (or any other reference file) in your output.

            OUTPUT FORMAT:
            - Post exactly ONE consolidated review comment on the PR using
              `gh pr comment` with your Bash tool.
            - The comment must contain ONLY your review findings, organized by
              category (e.g. Bugs, Security, Performance, Tests, Style).
            - Do not echo back reference files, file dumps, test fragments,
              placeholder text, or debugging output.
            - Do not post test comments, partial comments, or multiple comments.
              If a comment fails to post, retrying the IDENTICAL comment after a
              transient error is fine — but never retry with experimental content.
            - Compose the complete review BEFORE posting and post it in one
              `gh pr comment` call — never post a placeholder and edit it later.
            Be constructive and helpful in your feedback.

          # Tooling Claude is allowed to run.
          # --max-turns caps agent iterations (the action has no max_turns input;
          # CLI flags are passed via claude_args) — second runaway safeguard.
          # 40 (was 20): large mechanical diffs (e.g. a repo-wide import-sort)
          # exhausted 20 turns just paging the diff and died before posting
          # ("error_max_turns", no comment). At ~7 turns/min, 40 turns still
          # completes inside the 10-min timeout above, which remains the hard
          # cost ceiling (issue #176 / #188).
          claude_args: '--max-turns 40 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
