name: Claude Code PR Review

on:
  pull_request:
    types: [opened, synchronize]

# One review run per PR at a time; a new push cancels the in-flight run
# (third runaway safeguard for issue #188).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Runaway-run safeguard (issue #188): normal runs take ~3.5 min; a malfunctioning
    # run on PR #187 ran 55+ min posting junk comments before manual cancellation.
    timeout-minutes: 10

    # Bump perms so Claude can actually comment on the PR.
    permissions:
      contents: read          # can read code
      pull-requests: write    # can comment / review on PRs
      issues: write           # PR comments are "issue comments" under the hood
      id-token: write         # fine to leave as-is; mainly for OIDC/Bedrock/Vertex

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1   # you can make this 0 if you want full history/context

      - name: Run Claude Code Review
        id: claude-review
        # STEP-level timeout, deliberately shorter than the job's `timeout-minutes: 10`
        # (#626). A JOB timeout kills the whole job immediately and the "Report
        # incomplete review" step below never runs — so a large diff that ran long
        # would stay silent, the exact failure AC2 closes. A STEP timeout instead
        # FAILS this step (outcome == 'failure') while the job keeps ~1 min to post
        # the comment. Must exceed the --max-turns budget (60 turns ~= 8.6 min) so it
        # is the backstop, not the primary limit.
        timeout-minutes: 9
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1
        with:
          # Auth for Claude itself (OAuth token from https://console.anthropic.com)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Auth for GitHub (this is what lets gh comment without 'gh auth login')
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Your prompt / instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            CONTEXT (reference only): the repository's CLAUDE.md describes project
            conventions and style. Use it to inform your review, but do NOT include
            its content (or any other reference file) in your output.

            OUTPUT FORMAT:
            - Post exactly ONE consolidated review comment on the PR using
              `gh pr comment` with your Bash tool.
            - The comment must contain ONLY your review findings, organized by
              category (e.g. Bugs, Security, Performance, Tests, Style).
            - Do not echo back reference files, file dumps, test fragments,
              placeholder text, or debugging output.
            - Do not post test comments, partial comments, or multiple comments.
              If a comment fails to post, retrying the IDENTICAL comment after a
              transient error is fine — but never retry with experimental content.
            - Compose the complete review BEFORE posting and post it in one
              `gh pr comment` call — never post a placeholder and edit it later.
            - Fetch the diff ONCE with `gh pr diff` and review from that single
              result. Do NOT re-fetch or page it repeatedly — on a large PR that
              burns turns on the diff and can exhaust the budget before you post
              (issue #626).
            Be constructive and helpful in your feedback.

          # Tooling Claude is allowed to run.
          # --max-turns caps agent iterations (the action has no max_turns input;
          # CLI flags are passed via claude_args) — second runaway safeguard.
          # 60 (was 40, was 20): larger diffs (#624/#625: ~16 metered routes / two
          # rewritten test files) exhausted 40 turns and died before posting
          # ("error_max_turns", no comment). `timeout-minutes: 10` remains the hard
          # cost ceiling (#176/#188); at the observed ~7 turns/min that caps the
          # useful budget near 70 turns before the timeout would kill the run
          # instead of it finishing, so 60 (~8.6 min) is the ceiling with margin.
          # Beyond that, review economy is the lever (the single-fetch prompt rule
          # above) — and the "Report incomplete review" step below makes any
          # remaining exhaustion visible rather than silent (#626 AC2).
          claude_args: '--max-turns 60 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # #626 AC2: an absent verdict must not read as "no findings". When the review
      # step fails (error_max_turns exits 1) OR times out (its own timeout-minutes: 9
      # above), the action leaves only its placeholder and the red conclusion is
      # invisible on the PR thread. Post a visible comment so a reader can't mistake
      # silence for a clean review.
      #
      # Condition: `!cancelled() && outcome in (failure, cancelled)`, NOT `failure()`.
      # A GitHub gotcha — a *step-level* timeout does not cancel the JOB, so the job
      # keeps running here whether the timed-out step's outcome is reported as
      # 'failure' or 'cancelled'; both are covered, and `!cancelled()` is still true.
      # A concurrency-cancel (a newer push) OR the *job*-level timeout cancels the
      # whole job, making `cancelled()` true — so we correctly stay quiet there (and
      # the step's own 9-min timeout, below the job's 10, means we hit the step
      # timeout, not the job one, so this path stays reachable). `failure()` alone
      # would miss the timeout case entirely (a timeout reports 'cancelled', not
      # 'failure'); listing the two ran-but-unfinished outcomes explicitly also skips
      # the 'skipped' case (e.g. a checkout failure), which isn't the review's fault.
      - name: Report incomplete review
        if: ${{ !cancelled() && (steps.claude-review.outcome == 'failure' || steps.claude-review.outcome == 'cancelled') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body \
          "⚠️ **Claude Code review did not complete.** The review job failed before posting findings — commonly \`error_max_turns\` on a large diff. See the [job log]($RUN_URL). **This is not a clean review: an absent verdict is not a pass.** Re-run the job, or review the larger changes manually."
