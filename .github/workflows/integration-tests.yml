name: Integration Tests

# Service requirements (encoded below; see apps/backend/docs/TEST_INFRASTRUCTURE.md):
#   - MongoDB: Atlas test cluster via TEST_MONGODB_URI/TEST_MONGODB_DB secrets
#   - Redis:   localhost:6380 via docker-compose.test.yml (narrative-redis-test)
#   - S3:      LocalStack on localhost:4566 via docker-compose.test.yml
#   - OpenAI:  mocked (placeholder key)
# Locally, the same services come from:
#   docker compose -f apps/backend/docker-compose.test.yml up -d
# plus a local mongod (default TEST_MONGODB_URI=mongodb://localhost:27017/...).

on:
  # schedule:
  #   # Run nightly at 2 AM UTC - DISABLED (not in production yet)
  #   - cron: '0 2 * * *'
  workflow_dispatch:  # Manual triggering only (production not active)

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start test services
        working-directory: apps/backend
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Checking service containers..."
          docker ps -a

          echo "Waiting for Redis to be healthy..."
          timeout 120 bash -c 'while true; do
            status=$(docker inspect --format="{{.State.Health.Status}}" narrative-redis-test 2>/dev/null || echo "not found")
            echo "Redis: $status"
            if [ "$status" == "healthy" ]; then break; fi
            sleep 2
          done'
          echo "Redis is healthy!"

          echo "Waiting for LocalStack to be healthy..."
          timeout 120 bash -c 'while true; do
            status=$(docker inspect --format="{{.State.Health.Status}}" narrative-localstack-test 2>/dev/null || echo "not found")
            echo "LocalStack: $status"
            if [ "$status" == "healthy" ]; then break; fi
            sleep 2
          done'
          echo "LocalStack is healthy!"

          echo "All services ready!"
          echo "Note: MongoDB connection uses Atlas (configured via secrets)"

      - name: Run integration tests with coverage
        working-directory: apps/backend
        run: |
          PYTHONPATH=. uv run pytest \
            tests/integration/ \
            -v \
            -m integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          TEST_MONGODB_DB: ${{ secrets.TEST_MONGODB_DB }}
          # Deliberately the TEST cluster: no production database handle may
          # exist in the test job, even as a fallback (issue #160)
          MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          MONGODB_DB: ${{ secrets.TEST_MONGODB_DB }}
          TEST_REDIS_URL: redis://localhost:6380/0
          S3_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          OPENAI_API_KEY: sk-test-key-for-mocking

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/backend/coverage.xml
          flags: backend-integration
          name: integration-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage
          path: apps/backend/coverage.xml
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: apps/backend/test-results/
          retention-days: 30

      - name: Debug service logs on failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker ps -a
          echo ""
          echo "=== Redis Logs ==="
          docker logs narrative-redis-test --tail 100 || echo "Redis container not found"
          echo ""
          echo "=== LocalStack Logs ==="
          docker logs narrative-localstack-test --tail 100 || echo "LocalStack container not found"
          echo ""
          echo "Note: MongoDB uses Atlas (not containerized)"

      - name: Stop test services
        if: always()
        working-directory: apps/backend
        run: docker compose -f docker-compose.test.yml down -v
