name: Deploy (Staging)

# Automated staging deployment (issues #150, #831). `build-images` builds the
# backend and frontend images ONCE for the pushed commit and pushes them to GHCR;
# `deploy-staging` reaches the staging VPS over Tailscale, SSHes in as the deploy
# user and has the box pull those two images BY DIGEST and start them
# (scripts/deploy/deploy_images.sh). Nothing is built on the box, so the digest
# staging ran is the one production can be given. Application secrets live in
# .env.staging ON THE SERVER and are never passed through CI;
# scripts/deploy/compose.sh hands that file to compose. MongoDB is a managed Atlas
# cluster (MONGODB_URI in .env.staging) — no Mongo container is deployed.
#
# REGISTRY: ghcr.io/frankbria/narrative-modeling-app/{backend,frontend}, tagged with
# the commit SHA. The packages are private; the box pulls with this run's own
# GITHUB_TOKEN (packages: read), which expires with the run and is logged out of
# the box when the pull ends. No standing pull credential lives on the box.
#
# SOURCE MAPS (#1158): optional. With the repository secret SENTRY_AUTH_TOKEN and
# the repository variables SENTRY_ORG and SENTRY_PROJECT set, the frontend build
# uploads its maps under the commit SHA as the release; with any unset it uploads
# nothing and the image carries no map.
#
# NETWORK PATH (issue #384) — the VPS firewalls port 22 off the public internet:
# `ufw` allows 22 only from the home subnet and `on tailscale0`. A GitHub-hosted
# runner therefore CANNOT ssh to dev.briaanalytics.com; it joins the tailnet and
# connects to the box's tailnet address instead. Consequences:
#   * HOST must be the box's bare tailnet machine name (no `.ts.net` suffix;
#     MagicDNS resolves it on the runner). Setting it to dev.briaanalytics.com
#     will hang and then fail. Never the full MagicDNS name: its tailnet suffix
#     changes when the tailnet is renamed, and every deploy and health probe then
#     fails to resolve the host (#1150).
#   * SSH_KNOWN_HOSTS must be labelled with that same HOST value.
#   * The tailnet ACL must let `tag:ci` reach the staging box on port 22.
# Humans on the home subnet can still ssh to dev.briaanalytics.com directly; only
# CI needs the tailnet. Mirrors the working setup in frankbria/codeframe.
#
# Secrets live on the `Development` GitHub Environment
# (Settings → Environments → Development → Environment secrets), NOT as repo
# secrets with a STAGING_ prefix. This is the single source of truth — do not
# reintroduce repo-level STAGING_* secrets.
#   SSH_KEY            - private key authorized for the deploy user on HOST (required)
#   HOST               - staging box's bare TAILNET machine name, not its public DNS (required)
#   SSH_KNOWN_HOSTS    - pinned host key(s) for HOST; replaces live ssh-keyscan TOFU (required)
#   TS_OAUTH_CLIENT_ID - Tailscale OAuth client id, tag:ci scope (required)
#   TS_OAUTH_SECRET    - Tailscale OAuth client secret (required)
#   DEPLOY_USER        - optional; defaults to `root`
#   DEPLOY_PATH        - optional; defaults to /opt/narrative-modeling-app/staging
#
# Until all five required secrets are configured the job is a no-op that succeeds
# with a warning naming the missing ones, so main stays green. Idempotent:
# re-running on the same commit reconciles the server to that commit;
# `docker compose up -d` only recreates containers whose image or config changed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never run two staging deploys at once; let an in-flight deploy finish.
  group: deploy-staging
  cancel-in-progress: false

# Nothing by default; each job states what it needs.
permissions: {}

jobs:
  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    # Don't attempt builds from forks (no access to the registry).
    if: github.repository == 'frankbria/narrative-modeling-app'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.build.outputs.backend }}
      frontend: ${{ steps.build.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push both images
        id: build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          # The script prints only the two digest references on stdout.
          scripts/ci/build_images.sh "$GITHUB_SHA" --push "ghcr.io/$GITHUB_REPOSITORY" | tee -a "$GITHUB_OUTPUT"

      - name: Record the digests
        env:
          BACKEND_IMAGE: ${{ steps.build.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.build.outputs.frontend }}
        run: |
          # A digest or nothing: a tag can be pushed over, a digest cannot.
          case "$BACKEND_IMAGE$FRONTEND_IMAGE" in
            ghcr.io/*@sha256:*ghcr.io/*@sha256:*) ;;
            *) echo "::error::the build printed no digest reference for one of the images"; exit 1 ;;
          esac
          {
            echo "## Images built for \`$GITHUB_SHA\`"
            echo
            echo "- backend: \`$BACKEND_IMAGE\`"
            echo "- frontend: \`$FRONTEND_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-images
    # Don't attempt deploys from forks (no access to secrets).
    if: github.repository == 'frankbria/narrative-modeling-app'
    permissions:
      contents: read
      # The box pulls the images with this job's token (see the header).
      packages: read
    # Scopes the job to the Development environment's secrets and surfaces the
    # deployment (with any protection rules) under Settings → Environments.
    environment: Development
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deploy secrets are configured
        id: preflight
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=()
          [ -n "$SSH_KEY" ]            || missing+=("SSH_KEY")
          [ -n "$HOST" ]               || missing+=("HOST")
          [ -n "$SSH_KNOWN_HOSTS" ]    || missing+=("SSH_KNOWN_HOSTS")
          [ -n "$TS_OAUTH_CLIENT_ID" ] || missing+=("TS_OAUTH_CLIENT_ID")
          [ -n "$TS_OAUTH_SECRET" ]    || missing+=("TS_OAUTH_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets not set (${missing[*]}) — skipping deploy so main stays green. See .github/workflows/deploy.yml header."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The VPS firewalls port 22 off the public internet (ufw allows 22 only from
      # the home subnet and `on tailscale0`), so a GitHub-hosted runner cannot SSH
      # in directly — that is what broke every deploy after 2026-07-30 01:11
      # (issue #384). The runner joins the tailnet instead. HOST must therefore be
      # the box's bare tailnet machine name, NOT dev.briaanalytics.com.
      # Mirrors the working setup in frankbria/codeframe.
      - name: Connect to Tailscale
        if: steps.preflight.outputs.configured == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        if: steps.preflight.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # umask BEFORE writing: `printf > file` then `chmod 600` leaves the file
          # world-readable under the runner's default umask (022) for the moment in
          # between. That matters most for staging_key, which is a PRIVATE KEY.
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_key
          # Pinned host key from a secret rather than a live `ssh-keyscan` of HOST.
          # Two reasons: ssh-keyscan was trust-on-first-use (it accepted whatever
          # answered, so a MITM on the path was never detected), and it was the step
          # that failed opaquely once 22 was firewalled.
          #
          # ROTATION: if the VPS host key ever changes, deploys fail closed with
          # "Host key verification failed" — that is the intended behaviour, not a
          # bug. Re-pin from a trusted session, verifying the fingerprint out of
          # band first, using the tailnet HOST value (labels must match HOST):
          #   ssh-keyscan -t ed25519 <HOST> | gh secret set SSH_KNOWN_HOSTS --env Development
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        if: steps.preflight.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/narrative-modeling-app/staging' }}
          APP_VERSION: ${{ github.sha }}
          BACKEND_IMAGE: ${{ needs.build-images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Handed to the script on the box inside its body, not on a command line (#831).
          ON_BOX_FORWARD: APP_VERSION BACKEND_IMAGE FRONTEND_IMAGE REGISTRY_USER REGISTRY_TOKEN
        run: |
          # Every step reaches the box through on_box.sh (#790). The box checks out
          # this commit, pulls the two digests and starts them; it builds nothing.
          scripts/deploy/on_box.sh scripts/deploy/deploy_images.sh
          {
            echo "## Deployed to staging"
            echo
            echo "- commit: \`$APP_VERSION\`"
            echo "- backend: \`$BACKEND_IMAGE\`"
            echo "- frontend: \`$FRONTEND_IMAGE\`"
            echo
            echo "On the box: \`cat .deploy-images.env\` in the deploy directory."
          } >> "$GITHUB_STEP_SUMMARY"

      # The edge config used to be pasted onto the box by hand (#594), so the live
      # file drifted from the repo for two months and everything the repo file
      # thinks it owns — the #273 request-id map, the security headers, #768's
      # auth rate limit — was in git and had never run. The script renders
      # nginx-staging.conf from .env.staging and installs it; it is a NO-OP that
      # exits 0 until NGINX_SERVER_NAME is provisioned there, and a failed
      # `nginx -t` restores the previous file before failing the step.
      # Runs before the health check so a broken edge fails the deploy.
      - name: Apply nginx edge config
        if: steps.preflight.outputs.configured == 'true'
        # Its own bound: a wedged `nginx -t` or `systemctl reload` on the box would
        # otherwise hold the ssh session until the job's 20-minute timeout, and a
        # job-level kill would skip the health check and the state dump with it.
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/narrative-modeling-app/staging' }}
        run: |
          scripts/deploy/on_box.sh scripts/deploy/apply_nginx_conf.sh

      - name: Health check
        if: steps.preflight.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/narrative-modeling-app/staging' }}
        run: |
          # Wait on /health/ready (Mongo-backed: 503 until the service's pool
          # authenticates) — NOT bare /health, which answers 200 from a worker whose
          # credentials are dead — then run the per-subsystem probe inside the
          # container `up -d` just recreated. Every connection the probe makes is
          # therefore fresh: this is the restart-after-rotation smoke step of #552.
          # Backend is exposed on host port 8010 (see compose).
          scripts/deploy/on_box.sh <<'REMOTE'
          set -e
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8010/health/ready >/dev/null; then
              echo 'Backend ready.'; break
            fi
            if [ $i -eq 12 ]; then echo 'Backend did not become ready in time.'; exit 1; fi
            echo "Waiting for backend readiness ($i/12)..."; sleep 10
          done
          cd "$DEPLOY_PATH"
          scripts/deploy/compose.sh exec -T backend python -m app.health_probe
          REMOTE
          # The frontend's half of the shared credentials (#756): a fresh Mongo
          # connection from its container, and a token it signed, verified by the backend.
          # Captured by redirect, not a pipe: this shell has no pipefail, and a pipe
          # would hand the step tee's exit code instead of the probe's.
          frontend=0
          scripts/deploy/on_box.sh scripts/deploy/frontend_probe.sh \
            > /tmp/frontend-probe.txt || frontend=$?
          cat /tmp/frontend-probe.txt
          # A verdict line or it did not run (its first deploy exited 0 having printed nothing).
          grep -q '^frontend: ' /tmp/frontend-probe.txt || { echo "The frontend probe printed no verdict (exit $frontend)."; exit 1; }
          exit "$frontend"

      - name: Backend container state
        # Status fields and exception CLASS names only (public run log) — see the
        # script header. Mirrors staging-health.yml's step (#757).
        if: failure() && steps.preflight.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/narrative-modeling-app/staging' }}
        run: |
          scripts/deploy/on_box.sh scripts/deploy/backend_state.sh \
            > /tmp/state.txt 2>&1 || echo "(state dump failed: exit $?)" >> /tmp/state.txt
          cat /tmp/state.txt
          { echo "## Backend container state"; echo; echo '```'; cat /tmp/state.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/staging_key
