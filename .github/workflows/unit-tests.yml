name: Unit Tests

# Service requirements: NONE — this workflow runs only test paths that need no
# external services (no MongoDB, Redis, S3, or OpenAI).
#
# Suite-to-service mapping (see apps/backend/docs/TEST_INFRASTRUCTURE.md):
#   - The full backend suite (`uv run pytest`) additionally needs MongoDB on
#     localhost:27017; Redis-gated tests need the test Redis on localhost:6380
#     and S3-gated tests need LocalStack on localhost:4566, both provided by
#     `docker compose -f apps/backend/docker-compose.test.yml up -d`.
#     Tests whose service is unavailable skip with an explicit reason.
#   - integration-tests.yml (manual trigger) runs tests/integration/ with
#     those services in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Run unit tests with coverage
        # Path selection: only suites with zero service dependencies.
        # The marker filter additionally excludes any integration/performance
        # tests within those paths.
        working-directory: apps/backend
        run: |
          PYTHONPATH=. uv run pytest \
            tests/test_security/ \
            tests/test_processing/ \
            tests/test_utils/ \
            tests/test_models/ \
            tests/test_auth/ \
            tests/test_model_training/test_problem_detector.py \
            tests/test_model_training/test_feature_engineer.py \
            -m "not integration and not performance" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage.xml
          flags: backend-unit
          name: backend-unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: apps/backend/coverage.xml
          retention-days: 30

  frontend-unit-tests:
    name: Frontend Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          # Try npm ci first (faster), fall back to npm install if lock file is out of sync
          npm ci || (echo "npm ci failed, falling back to npm install" && npm install)

      - name: Run unit tests with coverage
        working-directory: apps/frontend
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: apps/frontend/coverage/
          retention-days: 30

  frontend-type-check-and-build:
    # CI gate for issue #166: Jest does not type-check, so without this job
    # `tsc --noEmit` / `next build` regressions land silently on main.
    name: Frontend Type Check & Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          # Try npm ci first (faster), fall back to npm install if lock file is out of sync
          npm ci || (echo "npm ci failed, falling back to npm install" && npm install)

      - name: Type check (tsc --noEmit)
        # Covers tests/ and e2e/ as well — next build alone excludes them.
        working-directory: apps/frontend
        run: npm run type-check

      - name: Production build (next build)
        # Catches module-resolution and prerender failures that tsc misses.
        working-directory: apps/frontend
        run: npm run build
        env:
          CI: true
          # Dummy values mirroring smoke-tests.yml — build must not need real secrets.
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-testing-only
