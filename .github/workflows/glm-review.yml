name: GLM Review
on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

# Two rules keep this check running. Break either and every run ends in
# `startup_failure`, or in two seconds with no job, and posts nothing; on a pull request
# that reads as a reviewer with no findings. scripts/ci/review_bots_health.sh watches for it.
#
# 1. No `concurrency:` block here. The called workflow declares its own group, keyed on
#    the pull request number. A caller-level block with the same key puts the caller and
#    the callee in one group, and the callee cancels its own parent as it queues.
#    Superseded runs are still cancelled on rapid pushes: that is the callee's block.
# 2. The `permissions:` block below grants at least what the pinned called workflow
#    declares. GitHub refuses to start a run whose caller grants less, before any job
#    exists. Re-pin and re-check the two together.

jobs:
  review:
    # Skip bot-authored PRs. claude-code-action refuses any run whose actor is
    # not a User and fails the step to say so, which shows up as a red check on
    # a PR that was never reviewed. Skipping instead reports it grey and honest.
    # Dependabot could not be reviewed here even if the guard were opened up:
    # GitHub runs Dependabot-triggered pull_request workflows with a read-only
    # token and the separate Dependabot secret store, so ZHIPU_API_KEY would be
    # empty and the summary comment unpostable. `user.type` covers every bot
    # rather than naming one.
    #
    # There is no size gate (#576). The one there was skipped a one-file credential
    # redaction: size says nothing about risk, and a small diff is a short review.
    # Docs-only pull requests are skipped by `paths-ignore` above.
    if: github.event.pull_request.user.type == 'User'
    # Pinned to a commit SHA (not @main) so an upstream push can't silently run
    # here with write perms + the ZHIPU_API_KEY secret (the repo's action-pinning
    # policy, see claude-code-review.yml). The pinned callee bounds a review by turns
    # and by a step timeout shorter than the job's, uploads the agent transcript as an
    # artifact, and rewrites its tracking comment into "GLM review did not complete"
    # rather than leaving a spinner that reads like a clean review. Since 777f02e9 it
    # also fails the check, with that notice, when the provider rejects the model call
    # (a `success` result with `is_error: true`, #955) instead of reporting success.
    uses: frankbria/glm-review/.github/workflows/review.yml@777f02e9bbb1b8b98f0d043809abe2bce3fa35fe # main @ 2026-10-13
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
