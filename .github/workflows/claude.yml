name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    # Runaway-run safeguard (issue #188). Higher budget than claude-review:
    # @claude tasks are open-ended (may write code), reviews are not.
    timeout-minutes: 30

    permissions:
      contents: read          # read the repo code if needed
      pull-requests: write    # allow commenting / reviewing on PRs
      issues: write           # allow commenting on issues (PR threads use this under the hood)
      actions: read           # let Claude inspect CI results if you want that
      id-token: write         # you had this already; keep if you need OIDC stuff

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9dd8b95a392eb34b6f5fb56cf5a64cb735912d4b # v1
        with:
          # Auth for Claude itself (OAuth token from Anthropic Console)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Auth for GitHub so Claude can call gh and write comments
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # (optional) Let Claude read CI info on the PR
          additional_permissions: |
            actions: read

          # --max-turns caps agent iterations (issue #188 runaway safeguard; the
          # action has no max_turns input — CLI flags are passed via claude_args)
          claude_args: '--max-turns 50'

          # (optional) custom prompt here if you want
          # prompt: 'Update the pull request description to include a summary of changes.'
