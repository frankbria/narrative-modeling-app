name: CI

# Primary pull-request gate for the monorepo (issue #150). Supersedes the old
# unit-tests.yml: it runs the backend, frontend, and MCP checks plus backend
# integration tests, and exposes a single aggregate `CI Success` status that
# branch protection on `main` requires.
#
# Service requirements (see apps/backend/docs/TEST_INFRASTRUCTURE.md):
#   - backend-unit / backend-lint / backend-typecheck: NONE (no external services).
#   - backend-integration: MongoDB (GitHub service container on 27017), Redis
#     (6380) and LocalStack S3 (4566) via apps/backend/docker-compose.test.yml.
#       NOTE: MONGODB_URI is pointed at the *container*, never a production
#       cluster — the test job must never hold a production DB handle (#160).
#       All three services are HARD requirements: CI_REQUIRE_SERVICES=true turns
#       a missing-service skip into a failure, so the S3/upload/OpenAI integration
#       suites can never silently skip in the gate (#221).
#   - frontend-* : NONE (build uses dummy env values; no real secrets).
#   - mcp-tests  : NONE.
#
# Idempotent: every job is read-only against external state; re-running a commit
# produces the same result. In-progress runs for a branch are cancelled when a
# new commit is pushed (concurrency group below).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: ruff check
        working-directory: apps/backend
        run: uv run ruff check .

  backend-typecheck:
    # Blocking gate (issue #219): mypy must pass clean. The baseline was burned
    # down to zero (#226) and deleted, so this is now a plain `mypy app/` — any
    # type error fails the build.
    name: Backend Type Check (mypy)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: mypy (blocking)
        working-directory: apps/backend
        run: uv run mypy app/

  backend-unit:
    name: Backend Unit Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Run unit tests with coverage
        # Path selection: only suites with zero service dependencies. The marker
        # filter additionally excludes integration/performance tests in them.
        working-directory: apps/backend
        run: |
          PYTHONPATH=. uv run pytest \
            tests/test_security/ \
            tests/test_processing/ \
            tests/test_utils/ \
            tests/test_models/ \
            tests/test_auth/ \
            tests/test_model_training/test_problem_detector.py \
            tests/test_model_training/test_feature_engineer.py \
            -m "not integration and not performance" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/backend/coverage.xml
          flags: backend-unit
          name: backend-unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend-integration:
    name: Backend Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mongodb:
        # Digest-pinned for reproducibility (issue #176). Dependabot's
        # github-actions ecosystem does NOT manage service `image:` refs, so these
        # are refreshed manually (or by a future docker-ecosystem entry).
        image: mongo:7.0@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Redis as a service container (not docker-compose) so it is guaranteed
      # healthy before any step runs — it is a hard requirement for the
      # redis-gated integration tests. Mapped to 6380 to match TEST_REDIS_URL.
      redis:
        # Digest-pinned; see the mongodb block above — same manual refresh process.
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Start LocalStack (S3, required)
        working-directory: apps/backend
        # LocalStack is a HARD requirement of the gate (issue #221): the S3/upload
        # integration suites must actually run, not silently skip. Combined with
        # CI_REQUIRE_SERVICES=true below (which turns a missing-service skip into a
        # failure), a Docker Hub hiccup or slow start fails the job loudly instead
        # of producing a green-but-under-tested run. Mongo + Redis (service
        # containers above) are already healthy before this step.
        run: |
          docker compose -f docker-compose.test.yml up -d localstack
          if ! timeout 120 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" narrative-localstack-test 2>/dev/null)" = "healthy" ]; do sleep 3; done'; then
            echo "::error::LocalStack did not become healthy in time; S3 integration tests cannot run."
            docker logs narrative-localstack-test 2>&1 | tail -50 || true
            exit 1
          fi
          echo "LocalStack healthy."
      - name: Run integration tests with coverage
        # Scope: the `integration`-marked suite in tests/integration/, now run with
        # all backing services provisioned — Mongo + Redis (service containers) and
        # LocalStack S3 (required step above). This includes the S3 fixtures, the
        # train→predict→S3 round-trip, the upload-workflow suite, and the
        # (fully-mocked) OpenAI suite (#221).
        # CI_REQUIRE_SERVICES=true makes a missing-service skip a hard failure, so
        # the gate can never go green while silently under-testing S3/OpenAI.
        working-directory: apps/backend
        run: |
          PYTHONPATH=. uv run pytest \
            tests/integration/ \
            -m integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          # Turn missing-service skips into failures so the gate stays honest (#221).
          CI_REQUIRE_SERVICES: 'true'
          # MongoDB service container (NOT a production cluster — see #160).
          TEST_MONGODB_URI: mongodb://localhost:27017/narrative_test
          TEST_MONGODB_DB: narrative_test
          MONGODB_URI: mongodb://localhost:27017/narrative_test
          MONGODB_DB: narrative_test
          TEST_REDIS_URL: redis://localhost:6380/0
          S3_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          OPENAI_API_KEY: sk-test-key-for-mocking
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/backend/coverage.xml
          flags: backend-integration
          name: backend-integration-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Stop test services
        if: always()
        working-directory: apps/backend
        run: docker compose -f docker-compose.test.yml down -v

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (eslint)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

  frontend-typecheck-build:
    name: Frontend Type Check & Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Type check (tsc --noEmit)
        working-directory: apps/frontend
        run: npm run type-check
      - name: Production build (next build)
        working-directory: apps/frontend
        run: npm run build
        env:
          CI: true
          # Dummy values mirroring the e2e-smoke job below — build must not need real secrets.
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret
          OPENAI_API_KEY: fake-openai-key-for-ci-only

  frontend-unit:
    name: Frontend Unit Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: apps/frontend
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: apps/frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-docker-build:
    name: Frontend Docker Build
    # Guards the deployed artifact (issue #277): CI otherwise never builds the
    # production image, so a broken Dockerfile or an untested Node major would
    # only surface at deploy time. Build-only — the image is not pushed. The
    # in-Dockerfile `npm run build` uses the same dummy env as the build stage,
    # so only NEXT_PUBLIC_API_URL (inlined at build time) needs supplying.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build frontend production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 \
            -t narrative-frontend:ci \
            apps/frontend

  shell-lint:
    name: Shell Lint (shellcheck)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/ops/* mutate and audit production infrastructure (#299), so a
      # typo there is more expensive than a typo in application code. shellcheck
      # ships on the GitHub runner image — no install step.
      #
      # severity=warning, not the default: the existing scripts carry `info`
      # findings that are correct as written (preflight_staging_env.sh writes a
      # literal compose file, so SC2016's "expressions don't expand in single
      # quotes" is the point). Everything tracked passes at this level today, so
      # the gate covers the whole directory rather than only the new files.
      - name: shellcheck
        run: |
          shopt -s globstar nullglob
          shellcheck --severity=warning scripts/**/*.sh
      # Lint proves syntax, not behaviour. The lifecycle merge in
      # configure-s3-backup.sh is the destructive-if-wrong part, so it gets real
      # tests against a stubbed `aws` — no AWS account needed.
      - name: ops script behaviour tests
        run: ./scripts/ops/test-configure-s3-backup.sh

  # ── MCP ────────────────────────────────────────────────────────────────────
  mcp-tests:
    name: MCP Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/mcp
        run: uv sync
      - name: Run MCP tests
        # Scope to the app's own tests/ — the vendored fastmcp/tests are the
        # upstream library's suite and are not part of this project's gate.
        working-directory: apps/mcp
        run: uv run pytest tests/ -v

  # ── E2E ────────────────────────────────────────────────────────────────────
  e2e-smoke:
    # Folded in from the former standalone smoke-tests.yml (issue #210) so the
    # functional @smoke gate is part of the single required `CI Success`
    # aggregate. The gate was stabilized in #157 (29 passed / 0 flaky) and
    # soaked green across 10+ PRs before enforcement. Wall-clock @perf tests
    # stay non-blocking in perf-tests.yml — they are NOT folded in here.
    name: E2E Smoke Tests
    # 30 min (was 15): on contended 2-core runners the uncached setup
    # (backend uv sync of the ML stack + npm ci + Playwright browser install)
    # could exceed 15 min before any test ran, cancelling the job mid-setup.
    # The Playwright cache below removes the largest chunk; the headroom covers
    # the rest (issue #176 CI hardening).
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mongodb:
        # Digest-pinned (issue #176); unified to the same mongo:7.0 digest as the
        # backend-integration job above.
        image: mongo:7.0@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs PR-authored test code AND uploads artifacts, so don't
          # persist GITHUB_TOKEN in .git/config (zizmor artipacked; CodeRabbit).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # Cache the downloaded Chromium binary across runs — the largest single
      # setup cost. Keyed on the lockfile so a Playwright version bump rebuilds
      # it. `--with-deps` still runs each time for the apt system libraries
      # (not stored in this cache path), but those are mostly preinstalled.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # GitHub Actions `services:` blocks cannot override a container's command,
      # and minio/minio requires `server /data` — so MinIO is started manually.
      - name: Start MinIO (S3-compatible storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          echo "Waiting for MinIO to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to start" >&2
          docker logs minio >&2
          exit 1

      - name: Create test bucket in MinIO
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://test-bucket

      - name: Run Smoke Tests
        working-directory: apps/frontend
        run: npm run test:e2e:smoke
        env:
          CI: true
          NODE_ENV: development
          TEST_USER_EMAIL: test@narrativeml.com
          TEST_USER_PASSWORD: test-password-123
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3010
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: narrative-modeling-test
          # Port configuration
          PORT: 3010
          BACKEND_PORT: 8000
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          # S3 storage backed by the MinIO container (no real AWS credentials).
          # NOTE: credentials must NOT start with "test-" — that prefix puts
          # S3Service into no-op mock mode; MinIO mode needs the real client.
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          # Three names for the same bucket: AWS_BUCKET_NAME (upload paths),
          # AWS_S3_BUCKET (download whitelist), S3_BUCKET (settings/versioning).
          # Env-var consolidation is tracked with CI hardening in #150.
          AWS_BUCKET_NAME: test-bucket
          AWS_S3_BUCKET: test-bucket
          S3_BUCKET: test-bucket
          AWS_ENDPOINT_URL: http://localhost:9000
          # OpenAI API key (dummy value for testing)
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-testing-only

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results
          path: apps/frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # ── Security ───────────────────────────────────────────────────────────────
  security-audit:
    # Advisory (issue #270): dependency scanning is inherently non-idempotent —
    # new advisories are published over time, so the same commit can flip red
    # without any code change. It is therefore EXCLUDED from the required
    # `CI Success` aggregate (like backend-typecheck) and surfaces vulnerable
    # deps on every PR; Dependabot (.github/dependabot.yml, pip + npm ecosystems)
    # opens the fix PRs. npm audit is clean today, so it goes red only on a NEW
    # high/critical; pip-audit surfaces the transitive long tail for ongoing
    # Dependabot triage. The known-fixable CVE tail (cryptography/pillow/lxml/
    # pyarrow/idna/pygments/python-dotenv/pyasn1/ecdsa/pytest) was bumped to fixed
    # releases; the single remaining advisory has no upstream fix and is ignored
    # below with a documented justification.
    name: Security Audit (pip-audit + npm audit)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: pip-audit (backend)
        working-directory: apps/backend
        run: |
          uv export --frozen --no-emit-project --no-hashes \
            --format requirements-txt -o requirements-audit.txt
          # PYSEC-2026-1325: Minerva-class timing side-channel in the pure-Python
          # `ecdsa` lib. NO upstream fix exists — the library documents that
          # constant-time operation is out of scope (SECURITY.md). It is a
          # transitive dep of python-jose; this app signs/verifies JWTs with
          # HS256 only (app/auth/nextauth_auth.py), so the ECDSA code path is
          # never exercised. Accepted + ignored rather than left to flip the job.
          uvx pip-audit -r requirements-audit.txt \
            --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high

  # ── Aggregate gate ─────────────────────────────────────────────────────────
  ci-success:
    # Single required status for branch protection. Depends on every BLOCKING
    # job; backend-typecheck (advisory) is intentionally excluded.
    name: CI Success
    if: always()
    needs:
      - backend-lint
      - backend-unit
      - backend-integration
      - frontend-lint
      - frontend-typecheck-build
      - frontend-unit
      - frontend-docker-build
      - mcp-tests
      - shell-lint
      - e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
