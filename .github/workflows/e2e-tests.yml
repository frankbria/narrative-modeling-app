name: E2E Full Suite

on:
  # Only run on manual trigger until we're ready for production
  # push:
  #   branches: [main]
  workflow_dispatch:  # Manual triggering only
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/e2e-tests.yml'

jobs:
  e2e-full-suite:
    timeout-minutes: 30  # With 4 workers, 210 tests should complete in ~10-15 mins
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # Allow other browsers to continue if one fails
      matrix:
        project: [chromium-full, firefox-full, webkit-full]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          # Try npm ci first (faster), fall back to npm install if lock file is out of sync
          npm ci || (echo "npm ci failed, falling back to npm install" && npm install)

      - name: Install Playwright Browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E Full Suite
        working-directory: apps/frontend
        run: npm run test:e2e:full -- --project=${{ matrix.project }}
        env:
          CI: true
          SKIP_AUTH: true  # Use auth bypass in CI for now
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: apps/frontend/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/frontend/playwright-report/
          retention-days: 30
