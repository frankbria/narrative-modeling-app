name: E2E Full Suite

# The non-smoke specs run here and nowhere else (#991). They are not in the PR
# gate, so a nightly run is what keeps them honest: a failure on main opens (or
# comments on) a tracking issue, and the next green run closes it. A suite that
# nothing runs rots, and every spec found that way this year could not pass.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e-full-suite:
    name: E2E Full Suite (chromium)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      mongodb:
        # Same digest as ci.yml's e2e-smoke and backend-integration jobs.
        image: mongo:7.0@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Start LocalStack (S3-compatible storage)
        working-directory: apps/backend
        run: |
          docker compose -f docker-compose.test.yml up -d localstack
          if ! timeout 120 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" narrative-localstack-test 2>/dev/null)" = "healthy" ]; do sleep 3; done'; then
            echo "::error::LocalStack did not become healthy in time."
            docker logs narrative-localstack-test 2>&1 | tail -50 || true
            exit 1
          fi

      - name: Run E2E Full Suite
        id: suite
        working-directory: apps/frontend
        run: npm run test:e2e:full
        env:
          # The same environment as ci.yml's e2e-smoke job.
          CI: true
          NODE_ENV: development
          TEST_USER_EMAIL: test@narrativeml.com
          TEST_USER_PASSWORD: test-password-123
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3010
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: narrative-modeling-test
          PORT: 3010
          BACKEND_PORT: 8000
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: us-east-1
          AWS_BUCKET_NAME: test-bucket
          AWS_S3_BUCKET: test-bucket
          S3_BUCKET: test-bucket
          AWS_ENDPOINT_URL: http://localhost:4566
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-testing-only

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-test-results
          path: apps/frontend/test-results/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-report
          path: apps/frontend/playwright-report/
          retention-days: 14

      - name: Report the failure on an issue
        # main only: a dispatch from a branch is someone trying a fix, not an alert.
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Dedupe on the stable phrase, never the full title: issues are retitled
          # with a PX.Y prefix (#757).
          search='"The nightly full e2e suite is failing" in:title'
          body="Run: $RUN_URL

          The Playwright report and the failing tests' artifacts are attached to the run. Repair each failing spec against the real app, or delete it with the reason (#991)."
          existing=$(gh issue list --state open --search "$search" --json number --jq 'min_by(.number).number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title '[P2] [testing] The nightly full e2e suite is failing' --body "$body"
          fi

      - name: Close a recovered alert
        if: steps.suite.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          search='"The nightly full e2e suite is failing" in:title'
          for n in $(gh issue list --state open --search "$search" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: the full suite passed in $RUN_URL"
          done
