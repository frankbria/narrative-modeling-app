name: E2E Full Suite

on:
  # Only run on manual trigger until we're ready for production
  # push:
  #   branches: [main]
  workflow_dispatch:  # Manual triggering only
  # pull_request:
  #  branches: [main]
  #  paths:
  #    - 'apps/frontend/**'
  #    - '.github/workflows/e2e-tests.yml'

jobs:
  e2e-full-suite:
    timeout-minutes: 20  # With sharding, each batch should complete in 10-15 mins
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # Allow other browsers to continue if one fails
      matrix:
        project: [chromium-full, firefox-full, webkit-full]
        shard: [1/3, 2/3, 3/3]  # Split each browser into 3 shards for faster execution

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright Browser
        working-directory: apps/frontend
        run: |
          # Extract browser name from project (e.g., chromium-full -> chromium)
          BROWSER=$(echo "${{ matrix.project }}" | sed 's/-full$//')
          echo "Installing only $BROWSER browser for this job"
          npx playwright install --with-deps $BROWSER

      - name: Set shard identifier
        id: shard
        run: echo "id=$(echo '${{ matrix.shard }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Run E2E Full Suite
        working-directory: apps/frontend
        run: npm run test:e2e:full -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          CI: true
          NODE_ENV: development
          TEST_USER_EMAIL: test@narrativeml.com
          TEST_USER_PASSWORD: test-password-123
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy-client-id
          GOOGLE_CLIENT_SECRET: dummy-client-secret
          GITHUB_ID: dummy-client-id
          GITHUB_SECRET: dummy-client-secret

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}-shard-${{ steps.shard.outputs.id }}
          path: apps/frontend/test-results/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}-shard-${{ steps.shard.outputs.id }}
          path: apps/frontend/playwright-report/
          retention-days: 30
