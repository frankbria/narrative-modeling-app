[project]
name = "narrative-modeling-app-backend"
version = "0.1.0"
description = "Narrative Modeling App"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-lifespan>=2.1.0",
    "beanie>=1.30.0",
    "boto3>=1.38.34",
    # >=0.116 is required for a starlette that clears the CVEs below; uv resolves
    # the current line that supports starlette 1.x. Issue #270.
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "numpy>=2.3.0",
    "openai>=1.86.0",
    "pandas>=2.3.0",
    "psutil>=6.1.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    # The multipart form parser central to uploads — 0.0.31 clears a run of
    # parser DoS/allocation CVEs (CVE-2026-53538/53539/53540 et al.). Issue #270.
    "python-multipart>=0.0.31",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.41",
    "sqlalchemy-utils>=0.41.2",
    # Direct floor: starlette must clear the multipart event-loop block
    # (CVE-2025-54121) plus the later Host-header auth-bypass (PYSEC-2026-161/248),
    # urlencoded-form DoS (PYSEC-2026-249) and FileResponse ReDoS (PYSEC-2026-1942)
    # — all fixed by 1.3.1. Issue #270.
    "starlette>=1.3.1",
    "tenacity>=8.2.3",
    # Direct floor on transitive dep: CVE-2026-25645 (fixed 2.33.0). Issue #270.
    "requests>=2.33.0",
    # Direct floor on the transitive dep (via boto3/requests): CVE-2025-50181/50182; issue #270.
    "urllib3>=2.5.0",
    "uvicorn>=0.34.3",
    "aiofiles>=24.1.0",
    "scipy>=1.11.0",
    "pyarrow>=23.0.1",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "xgboost>=3.0.2",
    "lightgbm>=4.6.0",
    "joblib>=1.5.1",
    "imbalanced-learn>=0.12.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "redis>=6.2.0",
    "gunicorn>=23.0.0",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
# Test + lint tooling. In `default-groups` (below) so plain `uv sync` (local, CI)
# installs it; the Docker build's `uv sync --no-dev` drops it from the image so
# pytest/ruff/benchmark never ship to production (issue #283).
dev = [
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.14.10",
    "mypy>=1.13.0",
]
# SHAP interpretability stack, isolated so production can build a slim image
# without it (issue #204). shap is the sole root pulling numba+llvmlite
# (~57 MB of wheels / ~186 MB on-disk; llvmlite alone is the bulk). It stays in
# default-groups below, so every normal install — local dev, CI, and the
# `uv sync --no-dev` Docker build — still gets it (beta behaviour unchanged).
# The code lazy-imports shap and degrades to model-native importance when it's
# absent (InterpretabilityService → None, endpoints report `partial`), and the
# Dockerfile's `import app.main` guard is lazy-safe — so a slim image built with
# `uv sync --no-dev --no-group interpretability` runs without SHAP.
interpretability = [
    "shap>=0.46.0",
]
# Hyperparameter tuning stack (issue #77), isolated on the same removable-lever
# pattern as interpretability. optuna powers Bayesian optimization; grid/random
# search use scikit-learn (always present). The Bayesian path lazy-imports optuna
# and degrades to random search when it's absent, so a slim image built with
# `uv sync --no-dev --no-group tuning` still trains and tunes (grid/random only).
tuning = [
    "optuna>=4.1.0",
]
# Error tracking + APM (issue #273), isolated on the same removable-lever pattern
# as interpretability/tuning. sentry-sdk is small, but grouping it keeps the
# convention consistent and makes init_sentry's ImportError guard meaningful: it
# stays in default-groups so dev/CI/`uv sync --no-dev` all ship it (init is a
# no-op unless SENTRY_DSN is set), while a slim image built with
# `uv sync --no-dev --no-group observability` drops it and the app still runs
# (init_sentry returns False on the ImportError).
observability = [
    "sentry-sdk[fastapi]>=2.0.0",
]

[tool.uv]
# Keep shap + optuna installed by default (beta ships both). --no-dev still
# installs interpretability and tuning; only an explicit --no-group drops them.
default-groups = ["dev", "interpretability", "tuning", "observability"]

[tool.ruff.lint]
# On top of the default rule set (E, F): import-sorting (isort, "I", issue #176)
# and pyupgrade ("UP", issue #220 — modernizes syntax/annotations to current
# Python: PEP 585 builtins, PEP 604 unions, datetime.UTC, etc.). UP was
# sequenced after the mypy gate (#219) so the annotation rewrites land on top of
# the typing work rather than colliding with it.
# flake8-print ("T20", issue #288) bans stray print()/pprint() in the app —
# debug prints leaked into request paths and shipped tracebacks to stdout. Use
# logging instead. print() inside generated-code string templates is not a real
# call node, so it is unaffected.
extend-select = ["I", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately follow runtime setup, not a style slip:
#   - app/main.py loads .env and mutates sys.path before importing app modules
#     so deployment-set env vars win and the package resolves (issue #149).
#     I001 is ignored too: isort would reorder those imports above the sys.path
#     mutation and break package resolution.
#   - the perf benchmark defers an import to its point of use.
"app/main.py" = ["E402", "I001"]
"tests/benchmarks/test_transformation_perf.py" = ["E402"]
# T20 (flake8-print, #288) bans print() in application code only. CLI/dev
# scripts, one-off task runners, and test debug output legitimately use print().
"scripts/**" = ["T20"]
"tasks/**" = ["T20"]
"tests/**" = ["T20"]

[tool.mypy]
# Blocking gate (issue #219). CI runs a plain `mypy app/` and fails on any error.
# The baseline of pre-existing errors was burned down to zero and removed (#226).
# The pydantic plugin teaches mypy about model field defaults.
plugins = ["pydantic.mypy"]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
# Treat `app` as the top-level package (the backend dir is the base); without
# this mypy walks up past the repo and maps files to both `app.*` and
# `backend.app.*`, aborting before it can check anything.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
