[project]
name = "narrative-modeling-app-backend"
version = "0.1.0"
description = "Narrative Modeling App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-lifespan>=2.1.0",
    "axios>=0.4.0",
    "beanie>=1.30.0",
    "boto3>=1.38.34",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "jwt>=1.3.1",
    "motor>=3.7.1",
    "numpy>=2.3.0",
    "openai>=1.86.0",
    "pandas>=2.3.0",
    "psutil>=6.1.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.41",
    "sqlalchemy-utils>=0.41.2",
    "tenacity>=8.2.3",
    "uvicorn>=0.34.3",
    "aiofiles>=24.1.0",
    "scipy>=1.11.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "xgboost>=3.0.2",
    "lightgbm>=4.6.0",
    "joblib>=1.5.1",
    "shap>=0.46.0",
    "imbalanced-learn>=0.12.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "redis>=6.2.0",
    "gunicorn>=23.0.0",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0.3",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.14.10",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "pytest-cov>=6.1.1",
    "mypy>=1.13.0",
]

[tool.ruff.lint]
# Add import-sorting (isort) on top of the default rule set (E, F) — issue #176.
# pyupgrade (UP) is deliberately not enabled here: it produces ~2,900 findings
# (repo-wide annotation rewrites) that would collide with the incremental mypy
# typing effort (issue #176, item 1) — tracked separately.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately follow runtime setup, not a style slip:
#   - app/main.py loads .env and mutates sys.path before importing app modules
#     so deployment-set env vars win and the package resolves (issue #149).
#     I001 is ignored too: isort would reorder those imports above the sys.path
#     mutation and break package resolution.
#   - the perf benchmark defers an import to its point of use.
"app/main.py" = ["E402", "I001"]
"tests/benchmarks/test_transformation_perf.py" = ["E402"]

[tool.mypy]
# Advisory gate (continue-on-error in CI): the backend is not yet fully typed,
# so this reports type issues without blocking. Tighten incrementally; the goal
# is to eventually make this a required check.
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
# Treat `app` as the top-level package (the backend dir is the base); without
# this mypy walks up past the repo and maps files to both `app.*` and
# `backend.app.*`, aborting before it can check anything.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
