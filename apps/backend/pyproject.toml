[project]
name = "narrative-modeling-app-backend"
version = "0.1.0"
description = "Narrative Modeling App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-lifespan>=2.1.0",
    "axios>=0.4.0",
    "beanie>=1.30.0",
    "boto3>=1.38.34",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "jwt>=1.3.1",
    "motor>=3.7.1",
    "numpy>=2.3.0",
    "openai>=1.86.0",
    "pandas>=2.3.0",
    "psutil>=6.1.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "sqlalchemy>=2.0.41",
    "sqlalchemy-utils>=0.41.2",
    "tenacity>=8.2.3",
    "uvicorn>=0.34.3",
    "aiofiles>=24.1.0",
    "scipy>=1.11.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "xgboost>=3.0.2",
    "lightgbm>=4.6.0",
    "joblib>=1.5.1",
    "imbalanced-learn>=0.12.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    "redis>=6.2.0",
    "gunicorn>=23.0.0",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0.3",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.14.10",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "pytest-cov>=6.1.1",
    "mypy>=1.13.0",
]
# SHAP interpretability stack, isolated so production can build a slim image
# without it (issue #204). shap is the sole root pulling numba+llvmlite
# (~57 MB of wheels / ~186 MB on-disk; llvmlite alone is the bulk). It stays in
# default-groups below, so every normal install — local dev, CI, and the
# `uv sync --no-dev` Docker build — still gets it (beta behaviour unchanged).
# The code lazy-imports shap and degrades to model-native importance when it's
# absent (InterpretabilityService → None, endpoints report `partial`), and the
# Dockerfile's `import app.main` guard is lazy-safe — so a slim image built with
# `uv sync --no-dev --no-group interpretability` runs without SHAP.
interpretability = [
    "shap>=0.46.0",
]

[tool.uv]
# Keep shap installed by default (beta requires SHAP). --no-dev still installs
# interpretability; only an explicit --no-group interpretability drops it.
default-groups = ["dev", "interpretability"]

[tool.ruff.lint]
# On top of the default rule set (E, F): import-sorting (isort, "I", issue #176)
# and pyupgrade ("UP", issue #220 — modernizes syntax/annotations to current
# Python: PEP 585 builtins, PEP 604 unions, datetime.UTC, etc.). UP was
# sequenced after the mypy gate (#219) so the annotation rewrites land on top of
# the typing work rather than colliding with it.
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately follow runtime setup, not a style slip:
#   - app/main.py loads .env and mutates sys.path before importing app modules
#     so deployment-set env vars win and the package resolves (issue #149).
#     I001 is ignored too: isort would reorder those imports above the sys.path
#     mutation and break package resolution.
#   - the perf benchmark defers an import to its point of use.
"app/main.py" = ["E402", "I001"]
"tests/benchmarks/test_transformation_perf.py" = ["E402"]

[tool.mypy]
# Blocking gate (issue #219). CI runs a plain `mypy app/` and fails on any error.
# The baseline of pre-existing errors was burned down to zero and removed (#226).
# The pydantic plugin teaches mypy about model field defaults.
plugins = ["pydantic.mypy"]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["import-untyped"]
# Treat `app` as the top-level package (the backend dir is the base); without
# this mypy walks up past the repo and maps files to both `app.*` and
# `backend.app.*`, aborting before it can check anything.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
