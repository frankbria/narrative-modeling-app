version: '3.8'

# ⚠️ SECURITY NOTICE ⚠️
# This Docker Compose file is for LOCAL TESTING ONLY
# All services run WITHOUT authentication for convenience
# DO NOT use these configurations in production or cloud environments
# DO NOT expose these ports to the internet

# 📝 MongoDB Configuration Note
# MongoDB has been removed from this Docker Compose file as the application
# now connects to MongoDB Atlas (cloud-hosted). Integration tests use the
# TEST_MONGODB_URI environment variable to connect to Atlas test database.
# Local MongoDB is no longer required for integration tests.

services:
  # Redis for background job testing
  # Note: Running without authentication for local testing only
  # DO NOT use this configuration in production
  redis-test:
    image: redis:7-alpine
    container_name: narrative-redis-test
    ports:
      - "6380:6379"  # Different port to avoid conflicts with dev Redis
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # LocalStack for S3 testing
  # Note: LocalStack uses fake AWS credentials for local testing only
  # These credentials never touch real AWS services
  localstack:
    image: localstack/localstack:3.0.2
    container_name: narrative-localstack-test
    ports:
      - "4566:4566"  # LocalStack edge port
      - "4571:4571"  # S3 specific port
    environment:
      SERVICES: s3
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      # LocalStack accepts any credentials - these are placeholders for local testing
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      # LocalStack >=1.0 persists under /var/lib/localstack; mounting a volume at
      # /tmp/localstack (legacy DATA_DIR layout) breaks 3.x startup ("Device or
      # resource busy" while it clears its tmp dir)
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

volumes:
  redis_test_data:
    driver: local
  localstack_data:
    driver: local

networks:
  test-network:
    driver: bridge
