# This file is part of the MCP project.

[project]
name = "mcp-modeling-server"
version = "0.1.0"
description = "FastMCP server for Narrative Modeling App"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Frank Bria", email = "frank.bria@gmail.com" }
]
# readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.2.4",
    "matplotlib>=3.8.4",
    "pydantic>=2.11.0",
    "scikit-learn>=1.6.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "boto3>=1.37.31",
    "openai>=1.72.0",
    "python-dotenv>=1.1.0",
    "exceptiongroup>=1.2.2",
    "mcp>=1.25.0",
    "openapi-pydantic>=0.5.1",
    "rich>=14.0.0",
    "typer>=0.15.2",
    "websockets>=15.0.1",
    "beanie>=1.26.0",
    "motor>=3.4.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
]