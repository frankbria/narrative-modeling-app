# ═══════════════════════════════════════════════════════════════
# SheetPredict - DEPLOYMENT (staging and production, one file: #831)
# ═══════════════════════════════════════════════════════════════
#
# Run it through scripts/deploy/compose.sh, never `docker compose -f` by hand.
# The wrapper supplies the four values this file requires and no env file holds:
#   ENVIRONMENT      the suffix of the env file on the box (.env.staging -> staging)
#   BACKEND_IMAGE    the images CI built for the deployed commit, by digest
#   FRONTEND_IMAGE   (.deploy-images.env, written by scripts/deploy/deploy_images.sh)
#   APP_VERSION      that commit
# Nothing is built on the box: both hosts pull the same digests, so production
# runs the image staging tested. Everything else that differs between the hosts
# comes from the env file (.env.staging / .env.production on the server).
#
# MongoDB is NOT run here: each environment uses a MongoDB Atlas cluster.
# Set MONGODB_URI (mongodb+srv://...) and MONGODB_DB in the env file.
#
# Port Assignments (to avoid conflicts on a shared server):
# - Frontend: 3011 (host), proxied via nginx (3010 is taken by
#   another app on the shared staging VPS)
# - Backend: 8010 (host), proxied via nginx
# - Redis: 6381 (host port)
#
# All published ports bind to 127.0.0.1 ONLY (issue #258). On a shared VPS a
# 0.0.0.0 bind exposes the API/app/redis over plaintext HTTP at the host IP,
# bypassing nginx TLS/HSTS/security headers (nginx upstreams to 127.0.0.1). It
# also leaks past UFW, since Docker's iptables DNAT is evaluated before the
# firewall — so loopback binding, not `ufw allow`, is the control that holds.
# nginx (nginx-staging.conf) and deploy.yml's health check reach these via
# localhost, so loopback binding keeps both working.
# ═══════════════════════════════════════════════════════════════

services:
  # Backend API (FastAPI)
  backend:
    image: ${BACKEND_IMAGE:?run this file through scripts/deploy/compose.sh}
    container_name: narrative-${ENVIRONMENT:?run this file through scripts/deploy/compose.sh}-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"  # loopback only — reached via nginx upstream (#258)
    environment:
      # Application
      ENVIRONMENT: ${ENVIRONMENT:?}
      DEBUG: "false"
      # Observability (#273): structured JSON logs so req_id/level are queryable;
      # SENTRY_DSN is required (#785): an unset DSN used to switch error tracking off silently.
      LOG_LEVEL: info
      LOG_FORMAT: json
      # The deployed commit, the same answer `docker inspect` gives for the image's revision label.
      APP_VERSION: ${APP_VERSION:?}
      SENTRY_DSN: ${SENTRY_DSN:?}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Rate limiting (#483): nginx fronts this container and sets X-Real-IP from
      # $remote_addr, so the limiter may key anonymous requests on it. Without this
      # every anonymous request behind nginx shares nginx's container IP as its bucket.
      RATE_LIMIT_TRUST_PROXY: "true"
      # The API as customers reach it (#915): the same https://host/api/v1 the frontend
      # is built with. Behind nginx the request itself says http://, and that is what
      # went into every deployment endpoint and generated SDK.
      PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

      # Database (MongoDB Atlas — values come from the env file)
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI (Atlas connection string) must be set in the env file}
      MONGODB_DB: ${MONGODB_DB:-narrative_modeling-${ENVIRONMENT}}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in the env file}@redis:6379/0

      # S3 Storage (real AWS S3, one bucket per environment).
      # The backend historically read the bucket under three names (uploads:
      # AWS_BUCKET_NAME, download allowlist: AWS_S3_BUCKET, versioning: S3_BUCKET)
      # and the region under two (AWS_REGION vs boto3's AWS_DEFAULT_REGION). #257
      # made the code resolve any of them, but we set every name from the single
      # ${S3_BUCKET_NAME} / ${AWS_DEFAULT_REGION} source so nothing can drift.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME (this environment's S3 bucket) must be set in the env file}
      AWS_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_S3_BUCKET: ${S3_BUCKET_NAME}
      S3_BUCKET: ${S3_BUCKET_NAME}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Security
      # CORS: the backend reads BACKEND_CORS_ORIGINS (config.py). It refuses '*'
      # in production-like envs, so this MUST list explicit origin(s) —
      # the old ALLOWED_ORIGINS name was read by nothing and left CORS wildcard.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS must list explicit origin(s) in the env file}
      # The backend validates NextAuth JWTs, so it needs the same secret the
      # frontend signs them with (app/auth/nextauth_auth.py).
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in the env file}
      # Signup model (#768): invite | open, read by both halves. Required
      # (#780), so the mode is a stated choice and not the blank default.
      SIGNUP_MODE: ${SIGNUP_MODE:?SIGNUP_MODE (invite|open) must be set in the env file}
      # Admin allowlist (#768): the only identities GET /metrics answers. Same
      # value as the frontend's; unset ⇒ nobody (fails closed), so optional.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Cost/abuse backstops (#768). Blank = the ADR-003 defaults (500 model
      # calls/day across all tenants; health probe alerts above 100 signups/day).
      AI_CALLS_DAILY_CEILING: ${AI_CALLS_DAILY_CEILING:-}
      SIGNUP_ALERT_THRESHOLD_24H: ${SIGNUP_ALERT_THRESHOLD_24H:-}
      # Invite-only beta gate (#261): comma-separated allowlist of invitee
      # emails, checked in invite mode. The frontend signIn callback is the
      # primary gate; the backend mirrors it. Not guarded here, because open
      # mode needs no list (#780): scripts/deploy/preflight_staging_env.sh
      # requires it whenever SIGNUP_MODE=invite.
      INVITE_ALLOWLIST: ${INVITE_ALLOWLIST:-}

      # Billing (#365/#367, issue #457). Without these the backend runs on FREE
      # limits and billing is INERT: /billing/checkout answers 503, every webhook
      # is rejected for want of a signing secret, and BillingStatus.configured is
      # false. That is a supported configuration (ADR-002), which is exactly why
      # their absence was invisible here for as long as it was — nothing errors,
      # the product simply cannot take money. The startup log now names any that
      # are unset (app/main.py), so a half-provisioned deploy is visible.
      #
      # Guarded (`:?`) since the test keys were provisioned (#598), so
      # scripts/deploy/preflight_staging_env.sh fails a deploy that lost one
      # instead of booting with billing silently off or half on. A secret key with
      # no webhook secret takes money and entitles nobody, which is worse than no
      # Stripe at all. The guarded set is stripe_client._REQUIRED_SETTINGS
      # (tests/test_security/test_staging_billing_env.py).
      #
      # STRIPE_PRICE_ENTERPRISE stays optional: ENTERPRISE is sales-led (ADR-003)
      # and its price is set only for a deal entitled through checkout. Guard it
      # here (and in _REQUIRED_SETTINGS) once one is: losing it resolves that
      # customer's price to PRO.
      #
      # The Stripe dashboard endpoint is https://<host>/webhooks/stripe/webhook —
      # outside /api/v1, see #456.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:?}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      # Email (#494, ADR-004). Optional (`:-`): with either unset the backend sends
      # no mail and says so at startup ("Email:"). Guard both with `:?` once the
      # sender domain is verified and job mail is something customers rely on.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # No PLAN_* overrides, deliberately (#457 AC4). The per-tier limits in
      # app/billing/plans.py ARE the intended configuration; they are placeholders
      # today and #474 replaces them there, in one place that applies to every
      # environment. Twelve env passthroughs would add twelve ways for this box —
      # whose config is partly hand-maintained (#594) — to silently disagree with
      # the code, to buy an override nobody is asking for.
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness (issue #273): /health/ready returns 503 when Mongo
      # is unreachable, so a container with dead Atlas is marked unhealthy instead
      # of staying "healthy" while serving 500s. /health is a bare liveness probe.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # Frontend (Next.js)
  frontend:
    image: ${FRONTEND_IMAGE:?run this file through scripts/deploy/compose.sh}
    container_name: narrative-${ENVIRONMENT}-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"  # loopback only — reached via nginx upstream (#258)
    environment:
      NODE_ENV: production
      # Read per request (lib/site.ts): anything but `production` makes
      # robots.txt disallow the whole site (#766). The same image serves dev.
      # and www., so this cannot be baked in at build.
      ENVIRONMENT: ${ENVIRONMENT}
      # Public settings (#831): read when a request arrives and written into the page
      # for the browser (lib/runtimeEnv.ts). None is a build arg, so one image serves
      # both hosts. The API base carries the /api/v1 prefix, e.g.
      # https://dev.sheetpredict.app/api/v1; the browser reports errors under the
      # backend's DSN and the same environment tag.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:?}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${ENVIRONMENT}
      # Server/edge error reporting (instrumentation.ts), same DSN as the backend.
      SENTRY_DSN: ${SENTRY_DSN:?}
      # The Plausible site that signed-out visits to the public pages are counted
      # under (#769). Read per request (lib/site.ts); blank counts nothing.
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      # NextAuth's MongoDB adapter (auth.ts -> lib/db.ts) connects at runtime;
      # lib/db.ts throws on startup without this.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI (Atlas connection string) must be set in the env file}
      # Same database as the backend. MONGODB_URI is bare (no path) because the
      # backend selects with `client[db_name]`, so without this the adapter falls
      # back to `client.db(undefined)` — which on a pathless URI is the database
      # literally named `test`, where staging's users and accounts have been going
      # (sessions are JWTs, not documents — see auth.ts session.strategy).
      MONGODB_DB: ${MONGODB_DB:-narrative_modeling-${ENVIRONMENT}}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # NextAuth v5 rejects requests whose Host it doesn't trust (UntrustedHost
      # 500s on every /api/auth/* route). Behind the nginx reverse proxy the
      # host arrives via X-Forwarded-Host, so it must be trusted explicitly.
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Signup model (#768) — same value as the backend; see the note there.
      SIGNUP_MODE: ${SIGNUP_MODE:?SIGNUP_MODE (invite|open) must be set in the env file}
      # Invite-only beta gate (#261) — same allowlist the backend mirrors. The
      # NextAuth signIn callback (auth.ts) rejects non-listed emails here.
      INVITE_ALLOWLIST: ${INVITE_ALLOWLIST:-}
      # Optional: where rejected users are pointed to request access (mailto or
      # a form URL). Defaults to a mailto in the error page when unset.
      NEXT_PUBLIC_INVITE_REQUEST_URL: ${NEXT_PUBLIC_INVITE_REQUEST_URL:-}
      # Admin allowlist (#477): only these emails reach /admin (middleware.ts).
      # Optional passthrough: unset ⇒ nobody is admin (fails closed), so it is
      # not a deploy gate until a value is provisioned (#457 pattern).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      # CORS allowlist for the Next.js page middleware (middleware.ts). Empty ⇒
      # no cross-origin Origin is echoed (same-origin needs no ACAO).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # Redis Cache
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: narrative-${ENVIRONMENT}-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"  # loopback only — redis is internal, never public (#258)
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      # redis runs with --requirepass, so the probe must authenticate (#277).
      # An unauthenticated `incr ping` gets NOAUTH-rejected → depends_on never
      # goes healthy (or false-passes). --no-auth-warning keeps stderr clean.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - narrative-network

volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  narrative-network:
    driver: bridge
    name: narrative-${ENVIRONMENT}-network
