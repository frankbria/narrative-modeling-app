# ═══════════════════════════════════════════════════════════════
# Nginx Configuration for Narrative Modeling App - Staging
# ═══════════════════════════════════════════════════════════════
#
# This configuration should be placed in /etc/nginx/sites-available/
# on the staging server (dev.briaanalytics.com) and symlinked to sites-enabled
#
# Location: /etc/nginx/sites-available/narrative-staging.conf
# Symlink: ln -s /etc/nginx/sites-available/narrative-staging.conf /etc/nginx/sites-enabled/
#
# After updating, test with: nginx -t
# Then reload: systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════

# Request correlation id (issue #273): reuse a client-supplied X-Request-ID *only
# when it's a safe token*, else fall back to nginx's own per-request $request_id.
# The raw header is logged verbatim into the access log, so validate it at the
# edge (mirrors the backend RequestIDMiddleware _SAFE_REQUEST_ID regex) — an
# unvalidated value would allow log injection. Propagated to the backend (which
# echoes it) so one id flows edge → app → logs.
map $http_x_request_id $req_id {
    default                        $request_id;
    "~^[A-Za-z0-9._-]{1,128}$"     $http_x_request_id;
}

# Access log format including the correlation id so edge logs join backend logs.
log_format narrative_main '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" req_id=$req_id';

# Upstream backend API
upstream narrative_backend {
    server 127.0.0.1:8010;
    keepalive 32;
}

# Upstream frontend (3011 — 3010 is taken by another app on the shared VPS)
upstream narrative_frontend {
    server 127.0.0.1:3011;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name narrative.yourdomain.com;  # REPLACE with actual domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name narrative.yourdomain.com;  # REPLACE with actual domain

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/narrative.yourdomain.com/fullchain.pem;  # REPLACE
    ssl_certificate_key /etc/letsencrypt/live/narrative.yourdomain.com/privkey.pem;  # REPLACE
    ssl_trusted_certificate /etc/letsencrypt/live/narrative.yourdomain.com/chain.pem;  # REPLACE

    # SSL configuration (Modern, secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging (narrative_main includes req_id for request correlation, #273)
    access_log /var/log/nginx/narrative-staging-access.log narrative_main;
    error_log /var/log/nginx/narrative-staging-error.log warn;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # NextAuth routes (must come before general /api/ block)
    location /api/auth/ {
        proxy_pass http://narrative_frontend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API routes. NO trailing slash on proxy_pass: the backend mounts
    # its routers under /api/v1, so the /api prefix must be preserved.
    # (NEXT_PUBLIC_API_URL = https://<domain>/api/v1)
    location /api/ {
        proxy_pass http://narrative_backend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Stripe webhook (#456). Deliberately NOT under /api/ — the backend mounts it
    # outside /api/v1 so RateLimitMiddleware can't 429 Stripe's small IP pool (#367),
    # which means the /api/ block above does not cover it and it would otherwise fall
    # through to `location /` and 404 at Next.js. A 404 here is silent and total:
    # checkout completes, entitlement never follows, cancellations never revoke.
    #
    # No URI on proxy_pass — the path must reach the backend verbatim, and a URI
    # here would rewrite it away from the mount. Nothing rewrites the body either
    # (no proxy_set_body, no rewrite): signature verification HMACs the exact bytes
    # (app/billing/stripe_signature.py). Stripe-Signature rides along — nginx
    # forwards client headers by default and nothing here clears it.
    #
    # 2m, not the server-wide 100M: this is an UNAUTHENTICATED endpoint, and the
    # backend's BodySizeLimitMiddleware only inspects a declared Content-Length, so
    # a chunked body skips it entirely and `await request.body()` buffers whatever
    # arrives — before any signature check. nginx caps chunked bodies too, so this
    # is the control that actually binds. Deliberately generous: a 413 loses the
    # event for good, and real Stripe events are a few KB.
    #
    # There is deliberately NO limit_req here, and that is the whole reason the
    # route lives outside /api/v1 (#367): Stripe delivers every tenant's events
    # from a small set of IPs, so an IP budget throttles Stripe itself, and the
    # retries bucket too. The trade is real — this is now an open unauthenticated
    # POST — but what an abuser gets is a 400 from a constant-time HMAC compare on
    # at most 2m of body, with nothing touched before verification. Rate-limiting
    # it would trade that for dropping real payment events.
    location /webhooks/stripe/ {
        client_max_body_size 2m;

        proxy_pass http://narrative_backend;
        # 1.1, not the 1.0 default to upstream: with request buffering off nginx
        # streams the body, and only 1.1 can chunk it without a Content-Length.
        proxy_http_version 1.1;

        # Deliberately a shorter set than the /api/ block: no X-Forwarded-Host or
        # X-Forwarded-Port. This handler reads the body and Stripe-Signature and
        # never reconstructs a URL, so there is nothing here to forward them for.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Shorter than the /api/ block's 60s too — this is a small, fast POST, and
        # Stripe's own delivery timeout is 20s, so holding a worker past that only
        # ties up resources for a response nobody is still listening for.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Matches the /api/ block. Note this is NOT what makes the body byte-exact —
        # buffering changes framing, never bytes — it just avoids spooling the
        # request through nginx on the way to a handler that reads it whole.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://narrative_backend/health;
        proxy_set_header X-Request-ID $req_id;
        access_log off;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://narrative_frontend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support for Next.js HMR (not needed in production, but useful for staging)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://narrative_frontend;
        proxy_cache_valid 200 1d;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
