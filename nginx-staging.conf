# ═══════════════════════════════════════════════════════════════
# Nginx Configuration for Narrative Modeling App - Staging
# ═══════════════════════════════════════════════════════════════
#
# This configuration should be placed in /etc/nginx/sites-available/
# on the staging server (dev.briaanalytics.com) and symlinked to sites-enabled
#
# Location: /etc/nginx/sites-available/narrative-staging.conf
# Symlink: ln -s /etc/nginx/sites-available/narrative-staging.conf /etc/nginx/sites-enabled/
#
# After updating, test with: nginx -t
# Then reload: systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════

# Request correlation id (issue #273): reuse a client-supplied X-Request-ID *only
# when it's a safe token*, else fall back to nginx's own per-request $request_id.
# The raw header is logged verbatim into the access log, so validate it at the
# edge (mirrors the backend RequestIDMiddleware _SAFE_REQUEST_ID regex) — an
# unvalidated value would allow log injection. Propagated to the backend (which
# echoes it) so one id flows edge → app → logs.
map $http_x_request_id $req_id {
    default                        $request_id;
    "~^[A-Za-z0-9._-]{1,128}$"     $http_x_request_id;
}

# Access log format including the correlation id so edge logs join backend logs.
log_format narrative_main '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" req_id=$req_id';

# Upstream backend API
upstream narrative_backend {
    server 127.0.0.1:8010;
    keepalive 32;
}

# Upstream frontend (3011 — 3010 is taken by another app on the shared VPS)
upstream narrative_frontend {
    server 127.0.0.1:3011;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name narrative.yourdomain.com;  # REPLACE with actual domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name narrative.yourdomain.com;  # REPLACE with actual domain

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/narrative.yourdomain.com/fullchain.pem;  # REPLACE
    ssl_certificate_key /etc/letsencrypt/live/narrative.yourdomain.com/privkey.pem;  # REPLACE
    ssl_trusted_certificate /etc/letsencrypt/live/narrative.yourdomain.com/chain.pem;  # REPLACE

    # SSL configuration (Modern, secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging (narrative_main includes req_id for request correlation, #273)
    access_log /var/log/nginx/narrative-staging-access.log narrative_main;
    error_log /var/log/nginx/narrative-staging-error.log warn;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # NextAuth routes (must come before general /api/ block)
    location /api/auth/ {
        proxy_pass http://narrative_frontend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API routes. NO trailing slash on proxy_pass: the backend mounts
    # its routers under /api/v1, so the /api prefix must be preserved.
    # (NEXT_PUBLIC_API_URL = https://<domain>/api/v1)
    location /api/ {
        proxy_pass http://narrative_backend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://narrative_backend/health;
        proxy_set_header X-Request-ID $req_id;
        access_log off;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://narrative_frontend;
        proxy_http_version 1.1;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support for Next.js HMR (not needed in production, but useful for staging)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://narrative_frontend;
        proxy_cache_valid 200 1d;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
