# ═══════════════════════════════════════════════════════════════
# Narrative Modeling App - STAGING DEPLOYMENT
# Server: dev.briaanalytics.com (47.88.89.175)
# Environment: Staging (pre-production)
# ═══════════════════════════════════════════════════════════════
#
# SECURITY NOTICE:
# This configuration uses authentication and secure settings
# Suitable for staging/production environments
# All secrets are provided via .env.staging on the server; run
# compose with `--env-file .env.staging` (deploy.yml does this).
#
# MongoDB is NOT run here — staging uses a MongoDB Atlas cluster.
# Set MONGODB_URI (mongodb+srv://...) and MONGODB_DB in .env.staging.
#
# Port Assignments (to avoid conflicts on shared server):
# - Frontend: 3011 (host), proxied via nginx (3010 is taken by
#   another app on the shared VPS)
# - Backend: 8010 (host), proxied via nginx
# - Redis: 6381 (host port)
# ═══════════════════════════════════════════════════════════════

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: narrative-staging-backend
    restart: unless-stopped
    ports:
      - "8010:8000"  # Custom port to avoid conflicts
    environment:
      # Application
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: info

      # Database (MongoDB Atlas — values come from .env.staging)
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI (Atlas connection string) must be set in .env.staging}
      MONGODB_DB: ${MONGODB_DB:-narrative_modeling-staging}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.staging}@redis:6379/0

      # S3 Storage (use real AWS S3 for staging).
      # The backend historically read the bucket under three names (uploads:
      # AWS_BUCKET_NAME, download allowlist: AWS_S3_BUCKET, versioning: S3_BUCKET)
      # and the region under two (AWS_REGION vs boto3's AWS_DEFAULT_REGION). #257
      # made the code resolve any of them, but we set every name from the single
      # ${S3_BUCKET_NAME} / ${AWS_DEFAULT_REGION} source so nothing can drift.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME (staging S3 bucket) must be set in .env.staging}
      AWS_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_S3_BUCKET: ${S3_BUCKET_NAME}
      S3_BUCKET: ${S3_BUCKET_NAME}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Security
      SECRET_KEY: ${BACKEND_SECRET_KEY}
      # CORS: the backend reads BACKEND_CORS_ORIGINS (config.py). It refuses '*'
      # in production-like envs, so this MUST list explicit staging origin(s) —
      # the old ALLOWED_ORIGINS name was read by nothing and left CORS wildcard.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS must list explicit staging origin(s) in .env.staging}
      # The backend validates NextAuth JWTs, so it needs the same secret the
      # frontend signs them with (app/auth/nextauth_auth.py).
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env.staging}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Full backend base URL INCLUDING the /api/v1 prefix, e.g.
        # https://dev.briaanalytics.com/api/v1 — baked in at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: narrative-staging-frontend
    restart: unless-stopped
    ports:
      - "3011:3000"  # Custom port to avoid conflicts (3010 is taken on the shared VPS)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # NextAuth's MongoDB adapter (auth.ts -> lib/db.ts) connects at runtime;
      # lib/db.ts throws on startup without this.
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI (Atlas connection string) must be set in .env.staging}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # NextAuth v5 rejects requests whose Host it doesn't trust (UntrustedHost
      # 500s on every /api/auth/* route). Behind the nginx reverse proxy the
      # host arrives via X-Forwarded-Host, so it must be trusted explicitly.
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      # CORS allowlist for the Next.js page middleware (middleware.ts). Empty ⇒
      # no cross-origin Origin is echoed (same-origin needs no ACAO).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # Redis Cache
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: narrative-staging-redis
    restart: unless-stopped
    ports:
      - "6381:6379"  # Custom port to avoid conflicts
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - narrative-network

volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  narrative-network:
    driver: bridge
    name: narrative-staging-network
