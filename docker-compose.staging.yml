version: '3.8'

# ═══════════════════════════════════════════════════════════════
# Narrative Modeling App - STAGING DEPLOYMENT
# Server: 47.88.89.175
# Environment: Staging (pre-production)
# ═══════════════════════════════════════════════════════════════
#
# SECURITY NOTICE:
# This configuration uses authentication and secure settings
# Suitable for staging/production environments
# All secrets should be provided via .env.staging file
#
# Port Assignments (to avoid conflicts on shared server):
# - Frontend: 3010 (internal), proxied via nginx
# - Backend: 8010 (internal), proxied via nginx
# - MongoDB: 27018 (host port)
# - Redis: 6381 (host port)
# ═══════════════════════════════════════════════════════════════

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: narrative-staging-backend
    restart: unless-stopped
    ports:
      - "8010:8000"  # Custom port to avoid conflicts
    environment:
      # Application
      ENVIRONMENT: staging
      DEBUG: "false"
      LOG_LEVEL: info

      # Database
      MONGODB_URI: mongodb://narrative_user:${MONGODB_PASSWORD}@mongodb:27017/narrative_staging?authSource=admin

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # S3 Storage (use real AWS S3 for staging)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Security
      SECRET_KEY: ${BACKEND_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: narrative-staging-frontend
    restart: unless-stopped
    ports:
      - "3010:3000"  # Custom port to avoid conflicts
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - narrative-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: narrative-staging-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # Custom port to avoid conflicts
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: narrative_staging
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongodb-init.js:/docker-entrypoint-initdb.d/init.js:ro
    command: mongod --auth
    healthcheck:
      test: |
        mongosh --username admin --password ${MONGODB_ROOT_PASSWORD} --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - narrative-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: narrative-staging-redis
    restart: unless-stopped
    ports:
      - "6381:6379"  # Custom port to avoid conflicts
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - narrative-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  narrative-network:
    driver: bridge
    name: narrative-staging-network
